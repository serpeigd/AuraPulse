[project]
name = "aurapulse"
version = "0.1.0"
description = "AuraPulse — detects recurring operational inconsistencies in restaurant reviews (Yelp Open Dataset) and turns them into actionable product-improvement signal"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pandas>=2",
    "python-dotenv>=1",
    "ollama>=0.4",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2",
    "types-openpyxl>=3.1",
]
ui = [
    "streamlit>=1.38",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "ollama.*"
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
