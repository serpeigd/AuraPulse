[project]
name = "aurapulse"
version = "0.1.0"
description = "AuraPulse — detects recurring operational inconsistencies in restaurant reviews (Yelp Open Dataset) and turns them into actionable product-improvement signal"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pandas>=2",
    "python-dotenv>=1",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
